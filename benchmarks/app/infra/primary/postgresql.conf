# Connection
listen_addresses = '*'
max_connections = 200
port = 5432

# Replication
wal_level = replica
wal_keep_size = 1GB
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

# Memory
shared_buffers = 1GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 64MB
huge_pages = off

# Write performance
synchronous_commit = off
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging (minimal for benchmarks)
log_min_duration_statement = 5000
log_checkpoints = on
