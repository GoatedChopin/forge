services:
  primary:
    image: postgres:18
    container_name: bench-pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./primary/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./pg_hba_repl.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  replica:
    image: postgres:18
    container_name: bench-pg-replica
    environment:
      PGPASSWORD: repl_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - replica_data:/var/lib/postgresql/data
    networks:
      - pgnet
    entrypoint: >
      bash -c "
      until pg_isready -h primary -U postgres; do
        echo 'waiting for primary...';
        sleep 2;
      done;

      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*;
        pg_basebackup -h primary -D /var/lib/postgresql/data -U repl_user -Fp -Xs -P -R;
        chown -R postgres:postgres /var/lib/postgresql/data;
      fi;

      chmod 0700 /var/lib/postgresql/data;
      exec gosu postgres postgres -c max_connections=200
      "

volumes:
  primary_data:
  replica_data:

networks:
  pgnet:
