[package]
name = "forge-bench"
version = "0.7.1"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
forge = { version = "0.7.1", package = "forgex" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "derive"] }
dotenvy = "0.15"
jsonwebtoken = "9"

[lints]
workspace = true
