[project]
name = "forge-bench"

[database]
url = "${DATABASE_URL}"
pool_size = 30
test_before_acquire = false

[database.pools.default]
size = 30
timeout_secs = 10
test_before_acquire = false

[gateway]
port = 8080
max_connections = 4096

[auth]
jwt_algorithm = "HS256"
jwt_secret = "${JWT_SECRET:-bench-secret-not-for-production}"

[observability]
enabled = false
