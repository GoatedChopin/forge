template_id = "with-dioxus/realtime-todo-list"
frontend = "dioxus"
canonical_internal_slug = "todo-dioxus"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  "docker-compose.yml",
  "Dockerfile",
  "README.md",
  "frontend/Cargo.toml",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "todo-dioxus-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/Cargo.toml"]

[[replacement]]
from = "name = \"todo-dioxus\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "POSTGRES_DB=todo-dioxus"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/todo-dioxus"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d todo-dioxus"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# todo-dioxus"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "todo-dioxus/"
to = "{{project_slug}}/"
files = ["README.md"]

# Convert workspace dep to standalone versioned dep
[[replacement]]
from = 'forge = { workspace = true }'
to = 'forge = { version = "0.8.1", package = "forgex" }'
files = ["Cargo.toml"]

# Convert workspace-relative docker-compose to standalone
[[replacement]]
from = "- ../../..:/workspace"
to = "- .:/app"
files = ["docker-compose.yml"]

[[replacement]]
from = "- ./target:/workspace/examples/with-dioxus/realtime-todo-list/target"
to = "- ./target:/app/target"
files = ["docker-compose.yml"]

[[replacement]]
from = "working_dir: /workspace/examples/with-dioxus/realtime-todo-list"
to = "working_dir: /app"
files = ["docker-compose.yml"]

# Convert workspace-relative Dockerfile to standalone
[[replacement]]
from = "WORKDIR /app/examples/todo-dioxus/frontend"
to = "WORKDIR /app/frontend"
files = ["Dockerfile"]

[[replacement]]
from = "examples/todo-dioxus/frontend/"
to = "frontend/"
files = ["Dockerfile"]

[[replacement]]
from = "COPY crates ./crates"
to = "COPY src ./src"
files = ["Dockerfile"]

[[replacement]]
from = "COPY examples/todo-dioxus ./examples/todo-dioxus"
to = "COPY migrations ./migrations"
files = ["Dockerfile"]

[[replacement]]
from = "COPY --from=frontend-builder /app/examples/todo-dioxus/frontend/dist ./examples/todo-dioxus/frontend/dist"
to = "COPY forge.toml sqlx.toml build.rs ./\nCOPY frontend ./frontend\nCOPY --from=frontend-builder /app/frontend/dist ./frontend/dist"
files = ["Dockerfile"]

[[replacement]]
from = "WORKDIR /app/examples/todo-dioxus"
to = ""
files = ["Dockerfile"]

[[replacement]]
from = "COPY --from=builder /app/examples/todo-dioxus/forge.toml /app/forge.toml"
to = "COPY forge.toml /app/forge.toml"
files = ["Dockerfile"]

[[replacement]]
from = "COPY --from=builder /app/examples/todo-dioxus/migrations /app/migrations"
to = "COPY migrations /app/migrations"
files = ["Dockerfile"]

[[replacement]]
from = "release/todo-dioxus"
to = "release/{{project_slug}}"
files = ["Dockerfile"]

[[replacement]]
from = "/app/todo-dioxus"
to = "/app/{{project_slug}}"
files = ["Dockerfile"]
