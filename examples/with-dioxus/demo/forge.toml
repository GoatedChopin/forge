# FORGE Configuration
# See https://tryforge.dev/docs/api/configuration for all options

[project]
name = "forge-dioxus-demo-template"
# version = "0.1.0"

[database]
url = "${DATABASE_URL}"
# pool_size = 50
# statement_timeout_secs = 30
# replica_urls = ["${DATABASE_REPLICA_URL}"]  # Read replica for scaling reads
# read_from_replica = false

[gateway]
port = 8080
# host = "0.0.0.0"
cors_origins = ["http://localhost:5173"]
# quiet_routes = ["/_api/health", "/_api/ready"]  # Routes excluded from traces/metrics/logs

[observability]
enabled = ${FORGE_OTEL_ENABLED-false}        # docker-compose sets FORGE_OTEL_ENABLED=true
otlp_endpoint = "http://localhost:4318"
# log_level = "info"                         # debug, info, warn, error
# enable_traces = true                       # per-signal override
# enable_metrics = true
# enable_logs = true
# sampling_ratio = 1.0                      # trace sampling (0.0-1.0), lower = less storage

# [function]
# default_timeout = 30  # seconds
# cache_enabled = true

# [worker]
# enabled = true
# concurrency = 4       # max concurrent jobs
# poll_interval = 1000  # milliseconds

# [auth]
# jwt_algorithm = "HS256"           # HS256, HS384, HS512, RS256, RS384, RS512
#
# --- HMAC (HS256/HS384/HS512) - symmetric, use for self-issued tokens ---
# jwt_secret = "${JWT_SECRET}"
#
# --- RSA (RS256/RS384/RS512) - asymmetric, use for external providers ---
# jwks_url = ""                     # Provider JWKS URLs: see auth reference docs

# [rate_limit]
# enabled = true
# requests = 100
# per = "1m"
# key = "user"  # user, ip, tenant, user_action, global

# [cluster]
# enabled = true
# heartbeat_interval = "5s"
# leader_election_timeout = "30s"
# node_name = "node-1"  # Optional, auto-generated if not set

# [node]
# roles = ["gateway", "function", "worker", "scheduler"]
# worker_capabilities = ["general"]  # general, gpu, high_cpu
