template_id = "with-dioxus/demo"
frontend = "dioxus"
canonical_internal_slug = "forge-dioxus-demo-template"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  "docker-compose.yml",
  "README.md",
  "frontend/Cargo.toml",
  "frontend/src/main.rs",
  "frontend/tests/home.spec.ts",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "forge-dioxus-demo-template-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/Cargo.toml"]

[[replacement]]
from = "name = \"forge-dioxus-demo-template\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "POSTGRES_DB=forge_dioxus_demo_template"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/forge_dioxus_demo_template"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d forge_dioxus_demo_template"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# demo"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "demo/"
to = "{{project_slug}}/"
files = ["README.md"]

[[replacement]]
from = "\"demo\""
to = "\"{{project_slug}}\""
files = ["frontend/src/main.rs", "frontend/tests/home.spec.ts"]
