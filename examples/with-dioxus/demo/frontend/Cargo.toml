[package]
name = "forge-dioxus-demo-template-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.3", default-features = false, features = ["asset", "document", "hooks", "html", "launch", "macro", "signals"] }
dioxus-web = { version = "=0.7.3", default-features = false, features = ["document"] }
forge_dioxus = { package = "forge-dioxus", path = "../../../../packages/forge-dioxus" }
hex = "0.4"
hmac = "0.12"
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
strip = "debuginfo"

[workspace]
