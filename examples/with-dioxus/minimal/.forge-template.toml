template_id = "with-dioxus/minimal"
frontend = "dioxus"
canonical_internal_slug = "forge-dioxus-minimal-template"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  "docker-compose.yml",
  "Dockerfile",
  "README.md",
  "frontend/Cargo.toml",
  "frontend/src/main.rs",
  "frontend/src/layout.rs",
  "frontend/src/pages/home.rs",
  "frontend/tests/home.spec.ts",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "forge-dioxus-minimal-template-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/Cargo.toml"]

[[replacement]]
from = "name = \"forge-dioxus-minimal-template\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "POSTGRES_DB=forge_dioxus_minimal_template"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/forge_dioxus_minimal_template"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d forge_dioxus_minimal_template"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# minimal"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "minimal/"
to = "{{project_slug}}/"
files = ["README.md"]

[[replacement]]
from = "\"minimal\""
to = "\"{{project_slug}}\""
files = ["frontend/src/main.rs", "frontend/src/layout.rs", "frontend/src/pages/home.rs", "frontend/tests/home.spec.ts"]

[[replacement]]
from = "forge-dioxus-minimal-template"
to = "{{project_slug}}"
files = ["Dockerfile"]

# Convert workspace-relative docker-compose to standalone
[[replacement]]
from = "- ../../..:/workspace"
to = "- .:/app"
files = ["docker-compose.yml"]

[[replacement]]
from = "- ./target:/workspace/examples/with-dioxus/minimal/target"
to = "- ./target:/app/target"
files = ["docker-compose.yml"]

[[replacement]]
from = "working_dir: /workspace/examples/with-dioxus/minimal"
to = "working_dir: /app"
files = ["docker-compose.yml"]
