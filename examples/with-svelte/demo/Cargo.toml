[package]
name = "forge-svelte-demo-template"
version = "0.8.2"
edition = "2024"
rust-version = "1.92"

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:rust-embed", "forge/embedded-frontend"]
testcontainers = ["forge/testcontainers"]

[dependencies]
forge = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
tracing = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
bcrypt = "0.16"
schemars = "0.8"
rust-embed = { version = "8", optional = true }

[build-dependencies]
which = "7"
