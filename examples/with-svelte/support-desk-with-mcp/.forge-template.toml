template_id = "with-svelte/support-desk-with-mcp"
frontend = "sveltekit"
canonical_internal_slug = "support-desk"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  "docker-compose.yml",
  "README.md",
  "frontend/package.json",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "support-desk-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/package.json"]

[[replacement]]
from = "name = \"support-desk\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "postgres://postgres:forge@localhost:5432/support-desk"
to = "postgres://postgres:forge@localhost:5432/{{project_db_name}}"
files = [".env"]

[[replacement]]
from = "POSTGRES_DB=support-desk"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/support-desk"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d support-desk"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# support-desk"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "support-desk/"
to = "{{project_slug}}/"
files = ["README.md"]
