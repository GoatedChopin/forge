template_id = "with-svelte/minimal"
frontend = "sveltekit"
canonical_internal_slug = "forge-svelte-minimal-template"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  "docker-compose.yml",
  "README.md",
  "frontend/package.json",
  "frontend/src/routes/+page.svelte",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "forge-svelte-minimal-template-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/package.json"]

[[replacement]]
from = "name = \"forge-svelte-minimal-template\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "POSTGRES_DB=forge_svelte_minimal_template"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/forge_svelte_minimal_template"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d forge_svelte_minimal_template"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# minimal"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "minimal/"
to = "{{project_slug}}/"
files = ["README.md"]

[[replacement]]
from = "<h1>minimal</h1>"
to = "<h1>{{project_slug}}</h1>"
files = ["frontend/src/routes/+page.svelte"]
