[project]
name = "kanban-board"

[database]
url = "${DATABASE_URL}"

[gateway]
port = 8080
cors_origins = ["http://localhost:5173"]

[auth]
jwt_algorithm = "HS256"
jwt_secret = "${JWT_SECRET}"
access_token_ttl = "1h"
refresh_token_ttl = "30d"

[observability]
enabled = ${FORGE_OTEL_ENABLED-false}
otlp_endpoint = "${OTEL_EXPORTER_OTLP_ENDPOINT-http://localhost:4318}"
