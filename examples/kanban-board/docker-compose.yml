services:
  backend:
    build:
      context: ../..
      dockerfile: examples/kanban-board/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:forge@db:5432/kanban_board
      - FORGE_OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318
    working_dir: /app/examples/kanban-board
    command: cargo watch --poll -w src -w migrations -w Cargo.toml -w ../../crates/ -x "run --no-default-features"
    volumes:
      - ../..:/app
      - cargo_cache:/usr/local/cargo/registry
      - ../../target:/app/target
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_api/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel:
    image: ghcr.io/isala404/forge/otel-lgtm:0.20.0
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  cargo_cache:
