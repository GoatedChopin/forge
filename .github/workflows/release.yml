name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forge

jobs:
  parse-changelog:
    name: Parse Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_date: ${{ steps.parse.outputs.release_date }}
      release_notes: ${{ steps.parse.outputs.release_notes }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version and notes from CHANGELOG.md
        id: parse
        run: |
          set -euo pipefail

          if [ ! -f "CHANGELOG.md" ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi

          # Extract first version after [Unreleased] (should be the version to release)
          VERSION=$(grep -E '^\#\# \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | sed -E 's/^\#\# \[([0-9]+\.[0-9]+\.[0-9]+[^]]*)\].*/\1/')

          if [ -z "$VERSION" ]; then
            echo "::error::No version found in CHANGELOG.md. Expected format: ## [X.X.X] - YYYY-MM-DD"
            exit 1
          fi

          echo "Found version: $VERSION"

          # Check if this version tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Update CHANGELOG.md with a new version before releasing."
            exit 1
          fi

          # Verify the version has a date and extract it
          VERSION_LINE=$(grep -E "^\#\# \[$VERSION\]" CHANGELOG.md)
          if ! echo "$VERSION_LINE" | grep -qE '\- [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Version $VERSION is missing a release date. Expected format: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi

          RELEASE_DATE=$(echo "$VERSION_LINE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$')

          # Verify Unreleased section exists and is empty (or has no content)
          UNRELEASED_CONTENT=$(awk '/^\#\# \[Unreleased\]/,/^\#\# \[/ {print}' CHANGELOG.md | tail -n +2 | head -n -1 | grep -v '^$' || true)
          if [ -n "$UNRELEASED_CONTENT" ]; then
            echo "::warning::Unreleased section has content. Consider moving it to a versioned section."
          fi

          # Extract release notes for this version (content between this version header and next version header)
          RELEASE_NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0; printing=0 }
            /^## \[/ {
              if (printing) exit
              if (index($0, "["ver"]")) { found=1; printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md)

          if [ -z "$RELEASE_NOTES" ]; then
            echo "::error::No release notes found for version $VERSION"
            exit 1
          fi

          # Check for prerelease
          IS_PRERELEASE="false"
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            IS_PRERELEASE="true"
          fi

          # Output version and date
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          # Output release notes (handle multiline)
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            echo "$RELEASE_NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

          echo "=== Release Info ==="
          echo "Version: $VERSION"
          echo "Date: $RELEASE_DATE"
          echo "Prerelease: $IS_PRERELEASE"
          echo "Release Notes:"
          echo "$RELEASE_NOTES"

  validate:
    name: Validate
    needs: parse-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (dry-run)
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features

  integration-test:
    name: Integration Tests
    needs: [parse-changelog, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build forge CLI
        run: cargo build --release

      - name: Install cargo-watch
        run: cargo install cargo-watch

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scaffold demo project
        run: |
          ./target/release/forge new /tmp/forge-integration-test --demo
          ls -la /tmp/forge-integration-test

      - name: Install Playwright
        working-directory: /tmp/forge-integration-test/frontend
        run: |
          bun install
          bunx playwright install chromium --with-deps

      - name: Start backend and run tests
        working-directory: /tmp/forge-integration-test
        run: |
          ${{ github.workspace }}/target/release/forge dev &
          FORGE_PID=$!

          echo "Waiting for backend..."
          for i in {1..180}; do
            if curl -s http://localhost:8080/_api/health | grep -q "healthy"; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 180 ]; then
              echo "Backend failed to start"
              kill $FORGE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for frontend..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            sleep 1
          done

          cd frontend
          bunx playwright test tests/home.spec.ts --reporter=line
          TEST_EXIT=$?

          kill $FORGE_PID 2>/dev/null || true

          exit $TEST_EXIT

  bump-versions:
    name: Bump Versions
    needs: [parse-changelog, validate]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Update workspace version
        run: |
          VERSION="${{ needs.parse-changelog.outputs.version }}"
          echo "Updating to version: $VERSION"
          cargo set-version --workspace "$VERSION"

      - name: Update internal crate dependencies
        run: |
          VERSION="${{ needs.parse-changelog.outputs.version }}"

          for crate_dir in crates/forge crates/forge-runtime crates/forge-codegen; do
            if [ -f "$crate_dir/Cargo.toml" ]; then
              sed -i "s/forge-core = { version = \"[^\"]*\"/forge-core = { version = \"$VERSION\"/g" "$crate_dir/Cargo.toml"
              sed -i "s/forge-macros = { version = \"[^\"]*\"/forge-macros = { version = \"$VERSION\"/g" "$crate_dir/Cargo.toml"
              sed -i "s/forge-runtime = { version = \"[^\"]*\"/forge-runtime = { version = \"$VERSION\"/g" "$crate_dir/Cargo.toml"
              sed -i "s/forge-codegen = { version = \"[^\"]*\"/forge-codegen = { version = \"$VERSION\"/g" "$crate_dir/Cargo.toml"
            fi
          done

      - name: Update scaffold template versions
        run: |
          VERSION="${{ needs.parse-changelog.outputs.version }}"

          for template in crates/forge/templates/*/project/Cargo.toml.tmpl; do
            if [ -f "$template" ]; then
              sed -i "s/forge = { version = \"[^\"]*\"/forge = { version = \"$VERSION\"/g" "$template"
            fi
          done

      - name: Update docs version
        run: |
          VERSION="${{ needs.parse-changelog.outputs.version }}"

          if [ -f "docs/package.json" ]; then
            jq --arg v "$VERSION" '.version = $v' docs/package.json > docs/package.json.tmp
            mv docs/package.json.tmp docs/package.json
          fi

          find docs -name "*.mdx" -o -name "*.md" | xargs -I {} sed -i "s/forge = { version = \"[^\"]*\"/forge = { version = \"$VERSION\"/g" {} 2>/dev/null || true
          find docs -name "*.mdx" -o -name "*.md" | xargs -I {} sed -i "s/forgex = { version = \"[^\"]*\"/forgex = { version = \"$VERSION\"/g" {} 2>/dev/null || true

      - name: Verify changes
        run: |
          echo "=== Cargo.toml workspace version ==="
          grep -A1 "\[workspace.package\]" Cargo.toml | grep version

          echo ""
          echo "=== Internal dependencies ==="
          grep -r "forge-core = { version" crates/*/Cargo.toml || true
          grep -r "forge-runtime = { version" crates/*/Cargo.toml || true

          echo ""
          echo "=== Scaffold template versions ==="
          grep "forge = { version" crates/forge/templates/*/project/Cargo.toml.tmpl || true

          echo ""
          echo "=== docs/package.json version ==="
          jq '.version' docs/package.json 2>/dev/null || echo "docs/package.json not found"

      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git commit -m "Bump version to ${{ needs.parse-changelog.outputs.version }}"
            git push origin main
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [parse-changelog, bump-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BINARY_NAME }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [parse-changelog, bump-versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${{ needs.parse-changelog.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "$file.sha256"
            done
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.parse-changelog.outputs.version }}
          name: ${{ needs.parse-changelog.outputs.version }} - ${{ needs.parse-changelog.outputs.release_date }}
          body: ${{ needs.parse-changelog.outputs.release_notes }}
          draft: false
          prerelease: ${{ needs.parse-changelog.outputs.is_prerelease == 'true' }}
          files: |
            artifacts/**/*

  publish-crates:
    name: Publish to crates.io
    needs: [parse-changelog, bump-versions, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Publish forge-macros
        run: cargo publish -p forge-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish forge-core
        run: |
          sleep 30
          cargo publish -p forge-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish forge-runtime
        run: |
          sleep 30
          cargo publish -p forge-runtime --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish forge-codegen
        run: |
          sleep 30
          cargo publish -p forge-codegen --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish forgex
        run: |
          sleep 30
          cargo publish -p forgex --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
