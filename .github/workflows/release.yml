---
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (validate + test without publishing)
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forge
  SQLX_OFFLINE: "true"

jobs:
  parse-changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_date: ${{ steps.parse.outputs.release_date }}
      release_notes: ${{ steps.parse.outputs.release_notes }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: bash scripts/ci/parse-changelog.sh

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: scripts/ci/create-env-stubs.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p forgex
      - uses: actions/upload-artifact@v4
        with:
          name: forge-cli
          path: target/debug/forge
          retention-days: 1

  test-template:
    name: ${{ matrix.template }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - with-svelte/minimal
          - with-svelte/demo
          - with-svelte/realtime-todo-list
          - with-svelte/support-desk-with-mcp
          - with-svelte/kanban-board
          - with-dioxus/minimal
          - with-dioxus/demo
          - with-dioxus/realtime-todo-list
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: template-build
          workspaces: /tmp/test-project -> target
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: forge-cli
          path: /tmp/forge-bin
      - run: chmod +x /tmp/forge-bin/forge
      - if: startsWith(matrix.template, 'with-dioxus/')
        uses: cargo-bins/cargo-binstall@main
      - if: startsWith(matrix.template, 'with-dioxus/')
        run: cargo binstall dioxus-cli@0.7.3 --no-confirm
      - run: scripts/ci/test-template.sh "${{ matrix.template }}" /tmp/forge-bin/forge "${{ github.workspace }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.template }}
          path: /tmp/test-project/frontend/test-results/
          retention-days: 7

  bump-versions:
    name: Bump Versions
    needs: [parse-changelog, validate, test-template]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: forge-cli
          path: /tmp/forge-bin
      - run: chmod +x /tmp/forge-bin/forge
      - run: cargo install cargo-edit
      - run: scripts/ci/create-env-stubs.sh
      - run: scripts/ci/bump-versions.sh "${{ needs.parse-changelog.outputs.version }}" /tmp/forge-bin/forge
      - id: commit
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            git diff --stat
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git commit -m "Bump version to ${{ needs.parse-changelog.outputs.version }}"
            git push origin main
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [parse-changelog, bump-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: scripts/ci/create-env-stubs.sh
      - run: cargo build --release --target ${{ matrix.target }} -p forgex
      - run: cd target/${{ matrix.target }}/release && tar czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz

  release:
    name: Release
    if: ${{ inputs.dry_run != true }}
    needs: [parse-changelog, bump-versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.parse-changelog.outputs.version }}" -m "Release v${{ needs.parse-changelog.outputs.version }}"
          git push origin "v${{ needs.parse-changelog.outputs.version }}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cd artifacts && for dir in */; do cd "$dir" && for f in *; do sha256sum "$f" > "$f.sha256"; done && cd ..; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.parse-changelog.outputs.version }}
          name: ${{ needs.parse-changelog.outputs.version }} - ${{ needs.parse-changelog.outputs.release_date }}
          body: ${{ needs.parse-changelog.outputs.release_notes }}
          prerelease: ${{ needs.parse-changelog.outputs.is_prerelease == 'true' }}
          files: artifacts/**/*

  publish-crates:
    name: Publish crates.io
    if: ${{ inputs.dry_run != true }}
    needs: [bump-versions, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for pkg in forge-macros forge-core forge-runtime forge-codegen; do
            sleep 30 && cargo publish -p $pkg --token $TOKEN 2>&1 || echo "$pkg already published"
          done
          sleep 30 && cd packages/forge-dioxus && cargo publish --allow-dirty --token $TOKEN 2>&1 || echo "forge-dioxus already published"
          cd "$GITHUB_WORKSPACE"
          bash scripts/build-template-archive.sh
          sleep 30 && cargo publish -p forgex --allow-dirty --token $TOKEN 2>&1 || echo "forgex already published"

  publish-npm:
    name: Publish npm
    if: ${{ inputs.dry_run != true }}
    needs: [bump-versions, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: cd packages/forge-svelte && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
