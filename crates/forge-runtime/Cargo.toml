[package]
name = "forge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime executors and gateway for the Forge framework"

[lints]
workspace = true

[dependencies]
forge-core = { version = "0.8.4", path = "../forge-core" }

tokio = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
dashmap = { workspace = true }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
futures-util = "0.3"
tokio-util = "0.7"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
bcrypt = { workspace = true }
base64 = "0.22"
serde_urlencoded = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Explicitly pin rustls-webpki features to avoid a Cargo feature-resolution edge case
# where rustls' `webpki/ring` + `webpki/std` feature propagation fails to activate on
# fresh lockfiles against rustls-webpki >= 0.103.12, leaving the crate without its
# `ring` and `std` features and causing E0463 ("can't find crate for ring / rustls_pki_types").
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[features]
testcontainers = ["forge-core/testcontainers"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = "3.14"
